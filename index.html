<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ສຸກສັນວັນເກີດ!</ນ້ອງມ້ອນເເຟນອ້າຍເສືອເພັງ>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans Lao", "Phetsarath OT", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 35%, #a18cd1 75%, #fbc2eb 100%);
      background-size: 300% 300%;
      animation: bgShift 12s ease infinite;
      overflow: hidden;
      color: #2d1b4e;
      padding: 20px;
      text-align: center;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ເເດງແລະຂາວ */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(80, 30, 120, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.7);
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      background: linear-gradient(90deg, #ff2e93, #ff7b00, #7b2cbf, #0096c7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1rem;
      color: #5a467a;
      margin-bottom: 18px;
    }

    .candle-counter {
      display: inline-block;
      background: #fff0f6;
      color: #c9184a;
      border: 1px solid #ffccd5;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /*  */
    .cake-stage {
      position: relative;
      width: 300px;
      height: 230px;
      margin: 0 auto 24px;
      cursor: pointer;
      user-select: none;
    }

    /* +1 */
    .candle-area {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 210px;
      height: 85px;
      z-index: 10;
    }

  
    .candle {
      position: absolute;
      bottom: 0;
      width: 12px;
      height: 46px;
      border-radius: 4px;
      transform: translate(-50%, 0);
      box-shadow: inset -2px 0 4px rgba(0, 0, 0, 0.15);
      animation: dropCandle 0.35s cubic-bezier(0.22, 1.4, 0.36, 1) forwards;
    }

    @keyframes dropCandle {
      0% {
        opacity: 0;
        transform: translate(-50%, -60px) scale(0.7);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    
    .flame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 18px;
      background: radial-gradient(circle at 50% 70%, #fff700 15%, #ff9500 60%, #ff3b00 100%);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      box-shadow: 0 0 12px #ffae00, 0 0 22px rgba(255, 136, 0, 0.7);
      animation: flicker 0.25s infinite alternate;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
      100% { transform: translateX(-50%) scale(1.12, 0.92) rotate(3deg); }
    }

    
    .cake {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
    }

    .layer-top {
      width: 210px;
      height: 55px;
      margin: 0 auto;
      background: linear-gradient(180deg, #ff758f 0%, #ff4d6d 100%);
      border-radius: 18px 18px 8px 8px;
      position: relative;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.08);
    }

    
    .icing {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22px;
      background: #fff0f3;
      border-radius: 18px 18px 12px 12px;
      display: flex;
      justify-content: space-around;
      padding: 0 8px;
    }

    .drip {
      width: 18px;
      height: 30px;
      background: #fff0f3;
