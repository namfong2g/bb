<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ຮ້ານ ນ້ຳດ່າງສົດຊື່ນ - ແນະນຳສິນຄ້າ</title>
  <style>
    body {
      font-family: "Noto Sans Lao", sans-serif;
      background-color: #ecfeff;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }

    .product-card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(8, 145, 178, 0.12);
      border: 1px solid #cffafe;
    }

    .store-header {
      background: linear-gradient(135deg, #0891b2, #0e7490);
      color: #ffffff;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .store-name {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    .store-tag {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .product-body {
      padding: 22px;
    }

    .badge {
      display: inline-block;
      background-color: #cffafe;
      color: #0e7490;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .product-title {
      margin: 0 0 8px;
      font-size: 1.3rem;
      color: #164e63;
    }

    .product-desc {
      margin: 0 0 16px;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.55;
    }

    .specs {
      list-style: none;
      padding: 0;
      margin: 0 0 18px;
      font-size: 0.9rem;
      color: #0f766e;
    }

    .specs li {
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: #0284c7;
      margin-bottom: 16px;
    }

    .buy-btn {
      display: block;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      background-color: #0891b2;
      color: #ffffff;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .buy-btn:hover {
      background-color: #0e7490;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <!-- ແຖບແປະຊື່ຮ້ານ -->
    <div class="store-header">
      <span class="store-name">ຮ້ານ ນ້ຳດ່າງສົດຊື່ນ</span>
      <span class="store-tag">ຮ້ານທາງການ</span>
    </div>

    <!-- ປ່ຽນ src ເປັນທີ່ຢູ່ຮູບພາບຂວດນ້ຳດ່າງຂອງທ່ານ (ເຊັ່ນ: images/alkaline-water.jpg) -->
    <img
      src="nam.jpg"
      alt="ຜະລິດຕະພັນນ້ຳດ່າງ pH 8.5+"
      class="product-image"
    />

    <div class="product-body">
      <span class="badge">ນ້ຳດ່າງທຳມະຊາດ</span>
      <h2 class="product-title">ນ້ຳດ່າງ PureLife (1 ແພັກ / 12 ຂວດ)</h2>
      <p class="product-desc">
        ນ້ຳດື່ມທີ່ຜ່ານການກັ່ນຕອງຄຸນນະພາບ ມີຄ່າ pH 8.5+ ຊ່ວຍປັບສົມດຸນໃຫ້ຮ່າງກາຍ ດື່ມງ່າຍ ສົດຊື່ນທຸກມື້.
      </p>

      <ul class="specs">
        <li>• ຄ່າ pH: 8.5 - 9.0</li>
        <li>• ຂະໜາດ: 600 ml x 12 ຂວດ</li>
        <li>• ຜ່ານມາດຕະຖານຄວາມສະອາດ</li>
      </ul>

      <div class="product-price">45,000 ກີບ / ແພັກ</div>
      <a href="#order" class="buy-btn">ສັ່ງຊື້ດຽວນີ້</a>
    </div>
  </div>

</body>
</html>
