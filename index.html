<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ສຸກສັນວັນເກີດ ນ້ອງມ້ອນແຟນອ້ານເສືອຟົງ 🎂</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Noto Sans Lao", "Phetsarath OT", system-ui, -apple-system, sans-serif;
      background: linear-gradient(125deg, #ff758f, #ff7eb3, #7b2cbf, #4361ee, #00bbf9);
      background-size: 350% 350%;
      animation: partyBg 10s ease infinite;
      overflow-x: hidden;
      color: #2b193d;
    }

    @keyframes partyBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(43, 25, 61, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.75);
    }

    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffe5ec, #e0aaff);
      color: #5a189a;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.7rem);
      line-height: 1.25;
      background: linear-gradient(90deg, #f72585, #ff7b00, #7209b7, #3a0ca3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 0.98rem;
      color: #594a6e;
      margin-bottom: 14px;
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff0f6;
      color: #c9184a;
      border: 1px solid #ffccd5;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    /* ພື້ນທີ່ກ້ອນເຄັກ */
    .cake-stage {
      position: relative;
      width: 310px;
      height: 245px;
      margin: 0 auto 22px;
      cursor: pointer;
      user-select: none;
    }

    .candle-zone {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 92px;
      z-index: 20;
    }

    .candle {
      position: absolute;
      width: 12px;
      height: 44px;
      border-radius: 4px 4px 2px 2px;
      transform: translateX(-50%);
      box-shadow: inset -2px 0 4px rgba(0, 0, 0, 0.18);
      animation: insertCandle 0.35s cubic-bezier(0.2, 1.45, 0.35, 1) forwards;
    }

    @keyframes insertCandle {
      0% {
        opacity: 0;
        margin-top: -55px;
        transform: translateX(-50%) scale(0.75);
      }
      100% {
        opacity: 1;
        margin-top: 0;
        transform: translateX(-50%) scale(1);
      }
    }

    .wick {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 6px;
      background: #333;
    }

    .flame {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 13px;
      height: 18px;
      background: radial-gradient(circle at 50% 72%, #fff9a6 15%, #ff9e00 58%, #ff2a00 100%);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      box-shadow: 0 0 12px #ffb703, 0 0 24px rgba(255, 123, 0, 0.75);
      animation: flicker 0.22s infinite alternate;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .candle.blown .flame {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
      animation: none;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
      100% { transform: translateX(-50%) scale(1.14, 0.9) rotate(3deg); }
    }

    .cake {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
    }

    .top-layer {
      width: 215px;
      height: 56px;
      margin: 0 auto;
      background: linear-gradient(180deg, #ff85a1 0%, #ff477e 100%);
      border-radius: 18px 18px 8px 8px;
      position: relative;
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.08);
    }

    .icing {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22px;
      background: #fff5f7;
      border-radius: 18px 18px 12px 12px;
      display: flex;
      justify-content: space-around;
      padding: 0 10px;
    }

    .drip {
      width: 18px;
      height: 30px;
      background: #fff5f7;
      border-radius: 0 0 12px 12px;
      margin-top: 8px;
    }

    .bottom-layer {
      width: 250px;
      height: 68px;
      margin: -2px auto 0;
      background: linear-gradient(180deg, #9c5a2b 0%, #6f3d19 100%);
      border-radius: 10px 10px 18px 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(70, 35, 10, 0.25);
    }

    .sprinkle {
      position: absolute;
      width: 8px;
      height: 4px;
      border-radius: 4px;
    }

    .plate {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 292px;
      height: 18px;
      background: linear-gradient(90deg, #dbeafe, #ffffff, #e2e8f0);
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 18px;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-add {
      background: linear-gradient(135deg, #f72585, #ff6d00);
      color: #fff;
      box-shadow: 0 6px 16px rgba(247, 37, 133, 0.35);
    }

    .btn-blow {
      background: linear-gradient(135deg, #0096c7, #48cae4);
      color: #fff;
      box-shadow: 0 6px 16px rgba(0, 150, 199, 0.3);
    }

    .btn-wish {
      background: linear-gradient(135deg, #7209b7, #4361ee);
      color: #fff;
      box-shadow: 0 6px 16px rgba(114, 9, 183, 0.32);
    }

    .btn-clear {
      background: #edf2f7;
      color: #334155;
    }

    .wish-card {
      background: #faf5ff;
      border-left: 4px solid #9d4edd;
      border-radius: 14px;
      padding: 14px 16px;
      line-height: 1.65;
      font-size: 1rem;
      color: #3a1c5a;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="card">
    <div class="badge">🎈 ງານສະຫຼອງວັນພິເສດ</div>
    <h1>🎉 ສຸກສັນວັນເກີດນ້ອງມ້ອນ 🎂</h1>
    <p class="hint">ກົດປຸ່ມນີ້ກ່ອນນ</p>

    <div class="status-bar">
      <span>🕯️ ທຽນທີ່ປັກແລ້ວ: <strong id="candle-count">0</strong> ອັນ</span>
      <span>•</span>
      <span id="flame-state">ໄຟທຽນ: 3 ດວງ</span>
    </div>

    <div class="cake-stage" id="cake-stage" title="ກົດປຸ່ມນີ້">
      <div class="candle-zone" id="candle-zone"></div>

      <div class="cake">
        <div class="top-layer">
          <div class="icing">
            <span class="drip"></span>
            <span class="drip" style="height: 36px;"></span>
            <span class="drip" style="height: 25px;"></span>
            <span class="drip" style="height: 34px;"></span>
            <span class="drip" style="height: 24px;"></span>
            <span class="drip" style="height: 31px;"></span>
          </div>
        </div>
        <div class="bottom-layer" id="bottom-layer"></div>
      </div>

      <div class="plate"></div>
    </div>

    <div class="actions">
      <button class="btn-add" id="btn-add">+ ປັກທຽນ 1 ອັນ</button>
      <button class="btn-blow" id="btn-blow">💨 ເປົ່າທຽນ</button>
      <button class="btn-wish" id="btn-wish">✨ ສຸກສັນວັນເກີດຄ່າາາຊີສມ້ອນຂອງອ້າຍໃຫຍ່ຂຶ້ນອີກປີເເລ້ວເດີ້ນ້ອງຫລ້າເຢ່ໆຄູ່ຫູຫມີ</button>
      <button class="btn-clear" id="btn-clear">🗑️ ລ້າງທຽນ</button>
    </div>

    <div class="wish-card" id="wish-card">
      ຂໍໃຫ້ມື້ນີ້ເຕັມໄປດ້ວຍຄວາມສຸກ, ຮອຍຍິ້ມ ແລະ ສິ່ງດີໆ ທີ່ເຂົ້າມາໃນຊີວິດຕະຫຼອດປີ! 💖
    </div>
  </main>

  <script>
    const candleZone = document.getElementById("candle-zone");
    const candleCountEl = document.getElementById("candle-count");
    const flameStateEl = document.getElementById("flame-state");
    const cakeStage = document.getElementById("cake-stage");
    const btnAdd = document.getElementById("btn-add");
    const btnBlow = document.getElementById("btn-blow");
    const btnWish = document.getElementById("btn-wish");
    const btnClear = document.getElementById("btn-clear");
    const wishCard = document.getElementById("wish-card");
    const bottomLayer = document.getElementById("bottom-layer");

    const candleColors = [
      "#ff2a6d", "#05d9e8", "#ffc857", "#06d6a0",
      "#b5179e", "#ff7b00", "#3a86ff", "#ef476f"
    ];

    const wishes = [
      "ຂໍໃຫ້ສຸຂະພາບແຂງແຮງ, ມີຄວາມສຸກທຸກມື້ ແລະ ສົມຫວັງໃນທຸກສິ່ງທີ່ຕັ້ງໃຈໄວ້! 🌟",
      "ສຸກສັນວັນເກີດ! ຂໍໃຫ້ອາຍຸໝັ້ນຂວັນຍືນ, ການງານການຮຽນກ້າວໜ້າ ແລະ ປະສົບຄວາມສຳເລັດສູງໆ! 🎁",
      "ຂໍໃຫ້ປີໃໝ່ຂອງຊີວິດນີ້ ເຕັມໄປດ້ວຍພະລັງບວກ, ມິດຕະພາບທີ່ໜ້າຮັກ ແລະ ຄວາມສຸກບໍ່ຂາດສາຍ! 🎈",
      "ຂໍໃຫ້ທຸກວັນເຕັມໄປດ້ວຍສຽງຫົວເລາະ ແລະ ຄວາມອົບອຸ່ນຈາກຄົນທີ່ຮັກ. ສຸກສັນວັນເກີດ! 🥳"
    ];

    const candles = [];
    const maxCandles = 24;

    // ສ້າງເມັດນ້ຳຕານສີສັນເທິງຊັ້ນລຸ່ມ
    function addSprinkles() {
      const colors = ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec", "#3a86ff", "#ffffff"];
      for (let i = 0; i < 26; i++) {
        const dot = document.createElement("span");
        dot.className = "sprinkle";
        dot.style.background = colors[i % colors.length];
        dot.style.left = (10 + Math.random() * 230) + "px";
        dot.style.top = (8 + Math.random() * 50) + "px";
        dot.style.transform = `rotate(${Math.random() * 180}deg)`;
        bottomLayer.appendChild(dot);
      }
    }
    addSprinkles();

    function updateCounters() {
      candleCountEl.textContent = candles.length;
      const litCount = candles.filter((c) => !c.blown).length;
      flameStateEl.textContent = `ໄຟທຽນ: ${litCount} ດວງ`;
    }

    function placeCandle(x = null, y = null) {
      if (candles.length >= maxCandles) {
        wishCard.textContent = "ປັກທຽນເຕັມກ້ອນເຄັກແລ້ວ! ກົດປຸ່ມ 'ເປົ່າທຽນ' ເພື່ອອະທິຖານໄດ້ເລີຍ 🎉";
        spawnConfetti(85);
        return;
      }

      const idx = candles.length;
      const color = candleColors[idx % candleColors.length];

      if (x === null || y === null) {
        const cols = 6;
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        x = 24 + col * 34 + (Math.random() * 8 - 4);
        y = 12 + row * 19 + (Math.random() * 4 - 2);
      }

      x = Math.max(14, Math.min(206, x));
      y = Math.max(4, Math.min(76, y));

      const el = document.createElement("div");
      el.className = "candle";
      el.style.left = `${x}px`;
      el.style.bottom = `${y}px`;
      el.style.zIndex = `${25 + Math.round(90 - y)}`;
      el.style.background = `repeating-linear-gradient(45deg, ${color}, ${color} 6px, #ffffff 6px, #ffffff 10px)`;

      const wick = document.createElement("div");
      wick.className = "wick";

      const flame = document.createElement("div");
      flame.className = "flame";

      el.appendChild(wick);
      el.appendChild(flame);
      candleZone.appendChild(el);

      candles.push({ el, blown: false });
      updateCounters();
      spawnConfetti(18);
    }

    cakeStage.addEventListener("click", (e) => {
      const rect = candleZone.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = rect.bottom - e.clientY;
      placeCandle(clickX, clickY);
    });

    btnAdd.addEventListener("click", () => placeCandle());

    btnBlow.addEventListener("click", () => {
      if (candles.length === 0) {
        wishCard.textContent = "ຍັງບໍ່ມີທຽນເທິງກ້ອນເຄັກເທື່ອ ລອງປັກທຽນກ່ອນເດີ! 🕯️";
        return;
      }
      candles.forEach((c) => {
        c.blown = true;
        c.el.classList.add("blown");
      });
      updateCounters();
      wishCard.textContent = "ຟູ່... ດັບທຽນໝົດແລ້ວ! ຂໍໃຫ້ຄຳອວຍພອນວັນເກີດເປັນຈິງທຸກປະການ! 🌈✨";
      spawnConfetti(100);
    });

    btnWish.addEventListener("click", () => {
      const pick = wishes[Math.floor(Math.random() * wishes.length)];
      wishCard.textContent = pick;
      spawnConfetti(95);
    });

    btnClear.addEventListener("click", () => {
      candleZone.innerHTML = "";
      candles.length = 0;
      updateCounters();
      wishCard.textContent = "ເກັບທຽນອອກໝົດແລ້ວ! ມາປັກທຽນໃໝ່ເທື່ອລະອັນນຳກັນ 🎂";
    });

    // ເອັບເຟັກ Confetti ຫຼາກຫຼາຍສີ
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    let pieces = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function spawnConfetti(amount = 60) {
      const palette = ["#ff2a6d", "#ffc857", "#05d9e8", "#06d6a0", "#b5179e", "#ff7b00"];
      for (let i = 0; i < amount; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -15 - Math.random() * 140,
          w: 7 + Math.random() * 8,
          h: 5 + Math.random() * 6,
          color: palette[Math.floor(Math.random() * palette.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: 2.2 + Math.random() * 4.5,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.22
        });
      }
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces = pieces.filter((p) => p.y < canvas.height + 25);

      for (const p of pieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vRot;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      requestAnimationFrame(renderConfetti);
    }

    renderConfetti();
    spawnConfetti(55);
  </script>
</body>
</html>
